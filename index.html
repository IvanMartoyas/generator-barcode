<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barcode Generator</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="libs/jsbarcode.min.js"></script>
  <script src="libs/qrcode.min.js"></script>
</head>
<body class="page">
  <main class="page">
    <h1 class="page__title">Barcode</h1>

    <div class="card">
      <div class="card__title">Настройки</div>
      
      <div class="field">
        <label class="field__label" for="shared-text">Данные</label>
        <textarea class="field__input" id="shared-text" placeholder="Введите данные..." rows="3"></textarea>
      </div>

      <div class="columns">
        <div class="field">
          <label class="field__label" for="barcode-type">Тип</label>
          <select class="field__input" id="barcode-type">
            <option value="CODE128">Code-128</option>
            <option value="QR">QR Code</option>
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="barcode-size">Размер</label>
          <select class="field__input" id="barcode-size">
            <option value="s">S</option>
            <option value="m" selected>M</option>
            <option value="l">L</option>
          </select>
        </div>
      </div>

      <div class="preview" id="preview-area">
        <div class="preview__canvas" id="barcode-canvas-container">
          <p class="preview__placeholder">Введите данные</p>
        </div>
      </div>

      <button class="button" id="btn-print" style="background-color: #28a745; border: none;">Печать</button>
    </div>
  </main>

  <script src="script.js"></script>
</body
</html>
